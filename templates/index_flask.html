<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhotoBooth</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">

<div class="card bg-gray-800 p-6 rounded-xl w-full max-w-4xl text-center text-gray-100">
    <h1 class="text-4xl font-extrabold text-white mb-6">
        Live Filter Photobooth
    </h1>

    <div class="flex justify-center mb-8 relative"> 
        <img 
            id="videoFeed" 
            src="/video_feed" 
            alt="Live Video Stream" 
            class="rounded-lg shadow-2xl"
            onerror="this.src='https://placehold.co/640x480/ef4444/ffffff?text=STREAM+ERROR+Refresh+Page';"
        >
        <div id="countdownOverlay" 
            class="absolute inset-0 flex items-center justify-center 
                    font-bold text-9xl"
            style="
                display: none;
                color: rgba(255,255,255,0.5);  
                text-shadow: 0 0 20px rgba(0,0,0,0.4); 
                pointer-events: none;
            ">
        </div>
    </div>

    <div id="messageBox" class="bg-indigo-900 text-white p-3 rounded-xl hidden mb-6 font-medium">
        <div class="message-content">
            <span id="messageText"></span>
            <button id="closeMessage" class="close-button" onclick="hideMessage()">x</button>
        </div>
    </div>

    <div class="flex flex-wrap justify-center gap-4">
        <button id="btnMustache" class="filter-button bg-gray-600 text-white py-2 px-4 rounded-full hover:bg-gray-500">Mustache</button>
        <button id="btnGlasses" class="filter-button bg-gray-600 text-white py-2 px-4 rounded-full hover:bg-gray-500">Glasses</button>
        <button id="btnPimpHat" class="filter-button bg-gray-600 text-white py-2 px-4 rounded-full hover:bg-gray-500">Pimp Hat</button>
        <button id="btnCowboyHat" class="filter-button bg-gray-600 text-white py-2 px-4 rounded-full hover:bg-gray-500">Cowboy Hat</button>
        <button id="btnOff" class="filter-button bg-red-600 text-white py-2 px-4 rounded-full hover:bg-red-700">Turn Off All</button>
        <button id="btnStartSession" class="filter-button bg-green-600 text-white py-2 px-4 rounded-full hover:bg-green-700 font-bold">Start 4-Photo Session</button>
    </div>
    <div id="session-captures" class="mt-8 w-full max-w-md mx-auto"></div>
    <div id="btnContinue" 
        class="filter-button bg-green-600 text-white py-2 px-4 mt-4 mx-auto 
                w-fit rounded-full hover:bg-green-700 font-bold"
        style="display: none;">
        Continue
    </div>
</div>

<canvas id="captureCanvas" style="display: none;"></canvas>

<script>
    // Định nghĩa các hằng số URL cho JavaScript sử dụng
    window.COMMAND_URL = "{{ url_for('handle_command', cmd='') }}"; 
    window.IMAGE_LIST_URL = "{{ url_for('get_latest_images') }}";
    window.IMAGE_SERVE_BASE_URL = "{{ url_for('serve_image', filename='') }}";
    window.BATCH_UPLOAD_URL = "{{ url_for('batch_upload') }}";
</script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
